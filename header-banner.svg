<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Mohd Shami, Applied ML and AI Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.6" fill="#000" fill-opacity="0.35"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#1B2142"/>
      <stop offset="1" stop-color="#05060F"/>
    </radialGradient>
  </defs>

  <!-- window frame -->
  <rect x="10" y="10" width="1180" height="280" fill="#C0C0C0"/>
  <path d="M10 290 V10 H1190" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <path d="M10 290 H1190 V10" stroke="#555555" stroke-width="2" fill="none"/>

  <!-- red title bar -->
  <rect x="16" y="16" width="1168" height="32" fill="#E22429"/>
  <text x="30" y="38" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="700" letter-spacing="2" fill="#FFFFFF">MOHD_SHAMI.EXE</text>
  <g font-family="'Courier New', Courier, monospace" font-size="16" font-weight="700" fill="#000">
    <rect x="1096" y="21" width="24" height="22" fill="#C0C0C0" stroke="#555"/>
    <text x="1103" y="38">_</text>
    <rect x="1124" y="21" width="24" height="22" fill="#C0C0C0" stroke="#555"/>
    <text x="1131" y="37">o</text>
    <rect x="1152" y="21" width="24" height="22" fill="#C0C0C0" stroke="#555"/>
    <text x="1158" y="37">x</text>
  </g>

  <!-- screen -->
  <rect x="22" y="56" width="1156" height="222" fill="url(#glow)"/>
  <path d="M22 278 V56 H1178" stroke="#555555" stroke-width="2" fill="none"/>
  <path d="M22 278 H1178 V56" stroke="#FFFFFF" stroke-width="2" fill="none"/>

  <g font-family="'Courier New', Courier, monospace">
    <text x="60" y="94" font-size="20" fill="#9FB3FF">C:\&gt; whoami</text>
    <text x="60" y="158" font-size="64" font-weight="700" letter-spacing="6" fill="#FFFFFF">MOHD SHAMI</text>
    <rect x="60" y="176" width="440" height="36" fill="#E22429"/>
    <text x="74" y="202" font-size="22" font-weight="700" letter-spacing="3" fill="#FFFFFF">APPLIED ML AND AI ENGINEER</text>
    <text x="60" y="256" font-size="20" fill="#9FB3FF">C:\&gt; with great code comes great responsibility</text>
    <rect x="632" y="240" width="12" height="20" fill="#E22429">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- scanlines -->
  <rect x="22" y="56" width="1156" height="222" fill="url(#scan)" pointer-events="none"/>
</svg>
