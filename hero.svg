<rect x="432" y="318" width="4" height="5"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" begin="0.3s" repeatCount="indefinite"/></rect>
<rect x="440" y="318" width="4" height="5"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.7s" begin="1.4s" repeatCount="indefinite"/></rect>
<rect x="532" y="312" width="4" height="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.0s" begin="0.8s" repeatCount="indefinite"/></rect>
<rect x="540" y="312" width="4" height="5"><animate attributeName="opacity" values="1;0.25;1" dur="2.7s" begin="1.7s" repeatCount="indefinite"/></rect>
<rect x="624" y="324" width="4" height="5"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.5s" begin="0.1s" repeatCount="indefinite"/></rect>
<rect x="632" y="324" width="4" height="5"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" begin="1.3s" repeatCount="indefinite"/></rect>
<rect x="726" y="314" width="4" height="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></rect>
<rect x="734" y="314" width="4" height="5"><animate attributeName="opacity" values="1;0.25;1" dur="3.6s" begin="1.6s" repeatCount="indefinite"/></rect>
<rect x="820" y="322" width="4" height="5"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="0.2s" repeatCount="indefinite"/></rect>
<rect x="918" y="318" width="4" height="5"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" begin="1.0s" repeatCount="indefinite"/></rect>
<rect x="926" y="318" width="4" height="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="0.4s" repeatCount="indefinite"/></rect>
</g>
<!-- corner webs -->
<g fill="none" stroke="#EAF2FF" stroke-opacity="0.35" stroke-width="1">
<g transform="translate(14,14)">
<path d="M0,22 L22,0"/><path d="M0,15 L15,0"/><path d="M0,8 L8,0"/>
<path d="M22,0 A26,26 0 0 1 0,22"/>
</g>
<g transform="translate(964,14)">
<path d="M0,22 L22,0"/><path d="M0,15 L15,0"/><path d="M0,8 L8,0"/>
<path d="M0,0 A26,26 0 0 0 22,22"/>
</g>
<g transform="translate(14,334)">
<path d="M0,0 L22,22"/><path d="M0,0 L15,15"/><path d="M0,0 L8,8"/>
<path d="M0,22 A26,26 0 0 1 22,0"/>
</g>
<g transform="translate(964,334)">
<path d="M22,0 L0,22"/><path d="M15,0 L0,15"/><path d="M8,0 L0,8"/>
<path d="M22,22 A26,26 0 0 1 0,0"/>
</g>
</g>
<!-- swinging spider silhouette (small, subtle) -->
<g fill="#E62429" opacity="0.45">
<g>
<animateMotion dur="18s" repeatCount="indefinite" rotate="auto"
path="M120,30 Q300,-30 500,20 Q700,70 880,10"/>
<ellipse cx="0" cy="0" rx="2.5" ry="3.5"/>
<circle cx="0" cy="-4.5" r="1.6"/>
<g stroke="#E62429" stroke-width="0.6" fill="none" stroke-linecap="round">
