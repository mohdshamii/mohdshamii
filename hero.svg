<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Spider-Sense: Robel Biruk, Friendly Neighborhood Developer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#05070D"/>
<stop offset="0.5" stop-color="#081226"/>
<stop offset="1" stop-color="#0B1626"/>
</linearGradient>
<radialGradient id="spiderGlow" gradientUnits="userSpaceOnUse" cx="500" cy="100" r="120">
<stop offset="0" stop-color="#E62429" stop-opacity="0.25"/>
<stop offset="1" stop-color="#E62429" stop-opacity="0"/>
</radialGradient>
<linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#E62429" stop-opacity="0.18"/>
<stop offset="1" stop-color="#E62429" stop-opacity="0"/>
</linearGradient>
</defs>
<!-- background -->
<rect width="1000" height="360" fill="url(#bg)"/>
<!-- faint web network across viewport -->
<g stroke="#EAF2FF" stroke-opacity="0.04" stroke-width="0.8" fill="none">
<path d="M500,100 Q250,40 0,0"/><path d="M500,100 Q750,40 1000,0"/>
<path d="M500,100 Q200,180 0,360"/><path d="M500,100 Q800,180 1000,360"/>
<path d="M500,100 L500,0"/><path d="M500,100 L0,180"/>
<path d="M500,100 L1000,180"/><path d="M500,100 L500,360"/>
<circle cx="500" cy="100" r="60"/><circle cx="500" cy="100" r="120"/>
<circle cx="500" cy="100" r="200"/><circle cx="500" cy="100" r="300"/>
</g>
<!-- stars -->
<g fill="#EAF2FF">
<circle cx="90"  cy="44" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
<circle cx="210" cy="70" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
<circle cx="340" cy="30" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.1s" repeatCount="indefinite"/></circle>
<circle cx="700" cy="52" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
<circle cx="830" cy="30" r="1.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.9s" repeatCount="indefinite"/></circle>
<circle cx="945" cy="88" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
<circle cx="60"  cy="120" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.4s" repeatCount="indefinite"/></circle>
<circle cx="940" cy="150" r="1.3"><animate attributeName="opacity" values="1;0.25;1" dur="3.1s" repeatCount="indefinite"/></circle>
<circle cx="160" cy="180" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.7s" repeatCount="indefinite"/></circle>
<circle cx="880" cy="200" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="4.2s" repeatCount="indefinite"/></circle>
</g>
<!-- rotating radar web behind emblem -->
<g transform="translate(500,100)">
<circle cx="0" cy="0" r="120" fill="url(#spiderGlow)"/>
<g>
<animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="48s" repeatCount="indefinite"/>
<g stroke="#EAF2FF" stroke-opacity="0.10" stroke-width="0.8" fill="none">
<line x1="0" y1="0" x2="0" y2="-140"/>
<line x1="0" y1="0" x2="121" y2="-70"/>
<line x1="0" y1="0" x2="140" y2="0"/>
<line x1="0" y1="0" x2="121" y2="70"/>
<line x1="0" y1="0" x2="0" y2="140"/>
<line x1="0" y1="0" x2="-121" y2="70"/>
<line x1="0" y1="0" x2="-140" y2="0"/>
<line x1="0" y1="0" x2="-121" y2="-70"/>
<circle cx="0" cy="0" r="35"/>
<circle cx="0" cy="0" r="70"/>
<circle cx="0" cy="0" r="105"/>
</g>
</g>
</g>
<!-- spider-sense ping ring -->
<g transform="translate(500,100)">
<circle cx="0" cy="0" r="16" fill="none" stroke="#FF3340" stroke-width="2">
<animate attributeName="r" values="16;64" dur="2.2s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.9;0" dur="2.2s" repeatCount="indefinite"/>
</circle>
<circle cx="0" cy="0" r="16" fill="none" stroke="#E62429" stroke-opacity="0.5" stroke-width="1.5"/>
</g>
<!-- spider emblem -->
<g transform="translate(500,100)">
<g fill="#E62429">
<ellipse cx="0" cy="0" rx="8.5" ry="13"/>
<circle cx="0" cy="-15" r="5.5"/>
</g>
<g stroke="#E62429" stroke-width="2.2" stroke-linecap="round" fill="none">
<path d="M-6,-6 C-16,-14 -25,-9 -32,-16"/>
<path d="M-7.5,-1 C-19,-3 -27,1 -34,6"/>
<path d="M-6.5,5 C-16,8 -24,14 -30,21"/>
<path d="M-4,9 C-11,14 -17,22 -21,28"/>
<path d="M6,-6 C16,-14 25,-9 32,-16"/>
<path d="M7.5,-1 C19,-3 27,1 34,6"/>
<path d="M6.5,5 C16,8 24,14 30,21"/>
<path d="M4,9 C11,14 17,22 21,28"/>
</g>
<circle cx="0" cy="-15" r="9" fill="#E62429">
<animate attributeName="opacity" values="0.35;0.75;0.35" dur="1.6s" repeatCount="indefinite"/>
</circle>
</g>
<!-- HUD status top-right -->
<g>
<circle cx="926" cy="34" r="4" fill="#2BD576">
<animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
</circle>
<text x="938" y="38" fill="#8B9BB4" font-family="'Cascadia Code',Consolas,monospace" font-size="12" letter-spacing="2">SYSTEM ONLINE</text>
</g>
<!-- SPIDER-SENSE ONLINE label -->
<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.4s" fill="freeze"/>
<text x="500" y="158" text-anchor="middle" fill="#E62429" font-family="'Cascadia Code',Consolas,monospace" font-size="15" letter-spacing="6">SPIDER-SENSE ONLINE</text>
</g>
<!-- name reveal -->
<g fill="#EAF2FF" text-anchor="middle">
<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.2s" fill="freeze"/>
<text x="500" y="224" font-family="Impact,'Arial Black',sans-serif" font-size="62" letter-spacing="6">MOHD SHAMI</text>
</g>
<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.7s" fill="freeze"/>
<text x="500" y="268" font-family="'Segoe UI',sans-serif" font-size="19" letter-spacing="5" fill="#9FB3CC">AI &amp; MACHINE LEARNING ENGINEER &#183; SYSTEMS ARCHITECT</text>
</g>
<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="2.2s" fill="freeze"/>
<text x="500" y="304" font-family="'Segoe UI',sans-serif" font-size="15" letter-spacing="4" fill="#EAF2FF">
<tspan fill="#EAF2FF">YOUR FRIENDLY NEIGHBORHOOD</tspan>
<tspan fill="#E62429" font-weight="bold"> AI ENGINEER</tspan>
</text>
</g>
</g>
<!-- cinematic skyline -->
