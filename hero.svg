<rect x="578" y="332" width="28" height="28"/>
<rect x="616" y="318" width="50" height="42"/>
<rect x="676" y="326" width="32" height="34"/>
<rect x="718" y="308" width="46" height="52"/>
<rect x="774" y="328" width="28" height="32"/>
<rect x="812" y="316" width="46" height="44"/>
<rect x="868" y="326" width="32" height="34"/>
<rect x="910" y="312" width="44" height="48"/>
<rect x="964" y="322" width="36" height="38"/>
</g>
<!-- horizon glow -->
<rect x="0" y="280" width="1000" height="80" fill="url(#horizonGlow)"/>
<!-- blinking windows -->
<g fill="#EAF2FF">
<rect x="98"  y="316" width="4" height="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" begin="0.0s" repeatCount="indefinite"/></rect>
<rect x="106" y="316" width="4" height="5"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" begin="0.7s" repeatCount="indefinite"/></rect>
<rect x="118" y="328" width="4" height="5"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="1.2s" repeatCount="indefinite"/></rect>
<rect x="194" y="320" width="4" height="5"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" begin="0.4s" repeatCount="indefinite"/></rect>
<rect x="202" y="320" width="4" height="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="0.9s" repeatCount="indefinite"/></rect>
