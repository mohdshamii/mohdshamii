<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="idBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060E"/>
      <stop offset="50%" stop-color="#081020"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D182E"/>
      <stop offset="100%" stop-color="#060C17"/>
    </linearGradient>

    <linearGradient id="redAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E27"/>
      <stop offset="100%" stop-color="#FF5E66"/>
    </linearGradient>

    <linearGradient id="blueAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>

    <radialGradient id="centerSpiderGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1E27" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#2B6CFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#04060E" stop-opacity="0"/>
    </radialGradient>

    <filter id="neonRedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="threadGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style><![CDATA[
    .hud-title {
      font-family: 'Impact', 'Arial Black', sans-serif;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .card-label {
      font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    .card-val {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 0.5px;
    }
    .card-sub {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 0.3px;
    }

    /* Web thread electrical pulse animations */
    @keyframes threadPulse {
      0%, 100% { stroke-opacity: 0.4; stroke-dashoffset: 0; }
      50% { stroke-opacity: 1; stroke-dashoffset: -20; }
    }

    @keyframes cardFloatLeft {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes cardFloatRight {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(3px); }
    }

    @keyframes radarPing {
      0% { r: 18px; opacity: 0.9; }
      50% { r: 65px; opacity: 0.35; }
      100% { r: 110px; opacity: 0; }
    }
  ]]></style>

  <!-- Background Base -->
  <rect width="1000" height="480" rx="12" fill="url(#idBgGrad)" stroke="#17365C" stroke-width="1.5"/>

  <!-- Matrix Grid Lines -->
  <g stroke="#0F2442" stroke-width="0.8" opacity="0.6">
    <line x1="0" y1="80" x2="1000" y2="80"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="0" y1="320" x2="1000" y2="320"/>
    <line x1="0" y1="400" x2="1000" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="800" y1="0" x2="800" y2="480"/>
  </g>

  <!-- Top Cinematic Header Bar -->
  <g transform="translate(30, 42)">
    <rect x="0" y="-18" width="8" height="26" fill="#FF1E27"/>
    <text x="18" y="0" fill="#FFFFFF" class="hud-title" font-size="22">
      IDENTITY WEB <tspan fill="#FF1E27">//</tspan> <tspan fill="#00D2FF">CHARACTER DOSSIER</tspan>
    </text>
    <text x="940" y="-2" text-anchor="end" fill="#8B9BB4" font-family="'SF Mono', Consolas, monospace" font-size="11" letter-spacing="2">
      SECURITY LEVEL: ALPHA-1
    </text>
  </g>

  <!-- ================= CENTRAL SPIDER-SENSE NEXUS ================= -->
  <g transform="translate(500, 260)">
    <!-- Ambient Radial Glow -->
    <circle cx="0" cy="0" r="130" fill="url(#centerSpiderGlow)"/>

    <!-- Radar Pulse Rings -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#FF1E27" stroke-width="2" style="animation: radarPing 2.5s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#00D2FF" stroke-width="1.5" style="animation: radarPing 2.5s cubic-bezier(0.2, 0.8, 0.4, 1) infinite; animation-delay: 1.25s;"/>

    <!-- Concentric Web Geometry -->
    <polygon points="0,-40 28,-28 40,0 28,28 0,40 -28,28 -40,0 -28,-28" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2"/>
    <polygon points="0,-75 53,-53 75,0 53,53 0,75 -53,53 -75,0 -53,-53" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>

    <!-- Central Spider Crest -->
    <circle cx="0" cy="0" r="26" fill="#0A162B" stroke="#FF1E27" stroke-width="2"/>
    <!-- Spider Body Vector -->
    <path d="M0,-12 C3,-12 6,-9 6,-4 C6,1 0,10 0,10 C0,10 -6,1 -6,-4 C-6,-9 -3,-12 0,-12 Z" fill="#FF1E27"/>
    <circle cx="0" cy="-14" r="3" fill="#FFFFFF"/>
    <!-- Spider Legs -->
    <path d="M-3,-6 Q-14,-14 -18,-18 M3,-6 Q14,-14 18,-18" stroke="#FF1E27" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-4,-2 Q-16,-6 -22,0 M4,-2 Q16,-6 22,0" stroke="#FF1E27" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-4,3 Q-16,8 -20,16 M4,3 Q16,8 20,16" stroke="#FF1E27" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-2,7 Q-12,16 -14,24 M2,7 Q12,16 14,24" stroke="#FF1E27" stroke-width="1.8" stroke-linecap="round"/>

    <!-- ================= CONNECTING WEB THREADS TO 6 NODES ================= -->
    <!-- Thread 1: To Top-Left (Name) -->
    <path d="M-20,-16 C-120,-60 -240,-120 -310,-140" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="6,4"
          style="animation: threadPulse 3s infinite;" filter="url(#threadGlow)"/>
    <!-- Pulse Energy Dot -->
    <circle r="3.5" fill="#FF1E27" filter="url(#neonRedGlow)">
      <animateMotion path="M0,0 C-120,-60 -240,-120 -310,-140" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Thread 2: To Mid-Left (Degree) -->
    <path d="M-26,0 C-140,0 -220,10 -310,0" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="6,4"
          style="animation: threadPulse 3.4s infinite;" filter="url(#threadGlow)"/>
    <circle r="3.5" fill="#00D2FF">
      <animateMotion path="M0,0 C-140,0 -220,10 -310,0" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Thread 3: To Bottom-Left (Role) -->
    <path d="M-20,16 C-120,60 -220,110 -310,140" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="6,4"
          style="animation: threadPulse 2.8s infinite;" filter="url(#threadGlow)"/>
    <circle r="3.5" fill="#FF1E27">
      <animateMotion path="M0,0 C-120,60 -220,110 -310,140" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Thread 4: To Top-Right (Location) -->
    <path d="M20,-16 C120,-60 240,-120 310,-140" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="6,4"
          style="animation: threadPulse 3.1s infinite;" filter="url(#threadGlow)"/>
    <circle r="3.5" fill="#00D2FF">
      <animateMotion path="M0,0 C120,-60 240,-120 310,-140" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Thread 5: To Mid-Right (Interests - AI/ML) -->
    <path d="M26,0 C140,0 220,10 310,0" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="6,4"
          style="animation: threadPulse 2.6s infinite;" filter="url(#threadGlow)"/>
    <circle r="3.5" fill="#FF1E27">
      <animateMotion path="M0,0 C140,0 220,10 310,0" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Thread 6: To Bottom-Right (Skills - Python/SQL) -->
    <path d="M20,16 C120,60 220,110 310,140" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="6,4"
          style="animation: threadPulse 3.3s infinite;" filter="url(#threadGlow)"/>
    <circle r="3.5" fill="#00D2FF">
      <animateMotion path="M0,0 C120,60 220,110 310,140" dur="2.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= 6 MULTIVERSE IDENTITY PODS ================= -->
  <!-- POD 1: CODENAME / NAME (Top-Left) -->
  <g transform="translate(40, 80)" style="animation: cardFloatLeft 6s ease-in-out infinite;">
    <rect width="280" height="92" rx="8" fill="url(#cardGrad)" stroke="#FF1E27" stroke-width="1.6"/>
    <!-- Corner web icon -->
    <path d="M0,24 L24,0 M0,12 L12,0" stroke="#FF1E27" stroke-width="1.2" fill="none"/>
    <circle cx="25" cy="30" r="14" fill="#081426" stroke="#FF1E27" stroke-width="1.2"/>
    <text x="25" y="35" text-anchor="middle" fill="#FF1E27" font-size="14">🕷️</text>
    
    <text x="48" y="26" fill="#8B9BB4" class="card-label">IDENTIFIER // ALIAS</text>
    <text x="48" y="48" fill="#FFFFFF" class="card-val">MOHD SHAMI</text>
    <text x="48" y="68" fill="#FF5E66" class="card-sub">Friendly Neighborhood Developer</text>
  </g>

  <!-- POD 2: DEGREE & GRADUATION (Mid-Left) -->
  <g transform="translate(40, 194)" style="animation: cardFloatLeft 6s ease-in-out infinite; animation-delay: -2s;">
    <rect width="280" height="92" rx="8" fill="url(#cardGrad)" stroke="#2B6CFF" stroke-width="1.6"/>
    <path d="M0,24 L24,0 M0,12 L12,0" stroke="#2B6CFF" stroke-width="1.2" fill="none"/>
    <circle cx="25" cy="30" r="14" fill="#081426" stroke="#2B6CFF" stroke-width="1.2"/>
    <text x="25" y="35" text-anchor="middle" fill="#00D2FF" font-size="14">🎓</text>

    <text x="48" y="26" fill="#8B9BB4" class="card-label">ACADEMIC PROTOCOL</text>
    <text x="48" y="48" fill="#FFFFFF" class="card-val">B.Tech Data Science</text>
    <text x="48" y="68" fill="#00D2FF" class="card-sub">Graduation: Class of 2027</text>
  </g>

  <!-- POD 3: ROLE & SPECIALIZATION (Bottom-Left) -->
  <g transform="translate(40, 308)" style="animation: cardFloatLeft 6s ease-in-out infinite; animation-delay: -4s;">
    <rect width="280" height="92" rx="8" fill="url(#cardGrad)" stroke="#FF1E27" stroke-width="1.6"/>
    <path d="M0,24 L24,0 M0,12 L12,0" stroke="#FF1E27" stroke-width="1.2" fill="none"/>
    <circle cx="25" cy="30" r="14" fill="#081426" stroke="#FF1E27" stroke-width="1.2"/>
    <text x="25" y="35" text-anchor="middle" fill="#FF1E27" font-size="14">⚡</text>

    <text x="48" y="26" fill="#8B9BB4" class="card-label">MISSION CAPACITY</text>
    <text x="48" y="48" fill="#FFFFFF" class="card-val">AI/ML &amp; Data Scientist</text>
    <text x="48" y="68" fill="#FF5E66" class="card-sub">End-to-End System Architecture</text>
  </g>

  <!-- POD 4: LOCATION / SECTOR (Top-Right) -->
  <g transform="translate(680, 80)" style="animation: cardFloatRight 6s ease-in-out infinite;">
    <rect width="280" height="92" rx="8" fill="url(#cardGrad)" stroke="#2B6CFF" stroke-width="1.6"/>
    <path d="M280,24 L256,0 M280,12 L268,0" stroke="#2B6CFF" stroke-width="1.2" fill="none"/>
    <circle cx="255" cy="30" r="14" fill="#081426" stroke="#2B6CFF" stroke-width="1.2"/>
    <text x="255" y="35" text-anchor="middle" fill="#00D2FF" font-size="14">📍</text>

    <text x="20" y="26" fill="#8B9BB4" class="card-label">GEO SECTOR // BASE</text>
    <text x="20" y="48" fill="#FFFFFF" class="card-val">India (Multiverse Node)</text>
    <text x="20" y="68" fill="#00D2FF" class="card-sub">Open for Global Missions &amp; Roles</text>
  </g>

  <!-- POD 5: INTERESTS & FOCUS AREAS (Mid-Right) -->
  <g transform="translate(680, 194)" style="animation: cardFloatRight 6s ease-in-out infinite; animation-delay: -2s;">
    <rect width="280" height="92" rx="8" fill="url(#cardGrad)" stroke="#FF1E27" stroke-width="1.6"/>
    <path d="M280,24 L256,0 M280,12 L268,0" stroke="#FF1E27" stroke-width="1.2" fill="none"/>
    <circle cx="255" cy="30" r="14" fill="#081426" stroke="#FF1E27" stroke-width="1.2"/>
    <text x="255" y="35" text-anchor="middle" fill="#FF1E27" font-size="14">🧠</text>

    <text x="20" y="26" fill="#8B9BB4" class="card-label">CORE INTELLIGENCE</text>
    <text x="20" y="48" fill="#FFFFFF" class="card-val">ML · Deep Learning · GenAI</text>
    <text x="20" y="68" fill="#FF5E66" class="card-sub">Autonomous Agents &amp; Neural Nets</text>
  </g>

  <!-- POD 6: LANGUAGES & DATA FOUNDATION (Bottom-Right) -->
  <g transform="translate(680, 308)" style="animation: cardFloatRight 6s ease-in-out infinite; animation-delay: -4s;">
    <rect width="280" height="92" rx="8" fill="url(#cardGrad)" stroke="#2B6CFF" stroke-width="1.6"/>
    <path d="M280,24 L256,0 M280,12 L268,0" stroke="#2B6CFF" stroke-width="1.2" fill="none"/>
    <circle cx="255" cy="30" r="14" fill="#081426" stroke="#2B6CFF" stroke-width="1.2"/>
    <text x="255" y="35" text-anchor="middle" fill="#00D2FF" font-size="14">💻</text>

    <text x="20" y="26" fill="#8B9BB4" class="card-label">FOUNDATIONAL ARSENAL</text>
    <text x="20" y="48" fill="#FFFFFF" class="card-val">Python · SQL · Data Science</text>
    <text x="20" y="68" fill="#00D2FF" class="card-sub">Rigorous Analytics &amp; Pipelines</text>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(500, 445)" text-anchor="middle">
    <text x="0" y="0" fill="#6B829E" font-family="'SF Mono', Consolas, monospace" font-size="11" letter-spacing="3">
      [ STATUS: DEPLOYABLE · VERIFIED B.TECH DATA SCIENCE CADRE · 2027 ]
    </text>
  </g>
</svg>
