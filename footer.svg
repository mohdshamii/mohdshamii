<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 110" role="img" aria-label="the web never sleeps">
<defs>
<linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#081426"/>
<stop offset="1" stop-color="#05070D"/>
</linearGradient>
<linearGradient id="fhGlow" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#E62429" stop-opacity="0.12"/>
<stop offset="1" stop-color="#E62429" stop-opacity="0"/>
</linearGradient>
</defs>
<!-- background -->
<rect width="1000" height="110" rx="16" fill="url(#fbg)" stroke="#17365C" stroke-width="1.2"/>
<!-- faint web network -->
<g stroke="#EAF2FF" stroke-opacity="0.035" stroke-width="0.6" fill="none">
<path d="M500,50 Q250,15 0,0"/><path d="M500,50 Q750,15 1000,0"/>
<path d="M500,50 Q200,80 0,110"/><path d="M500,50 Q800,80 1000,110"/>
<circle cx="500" cy="50" r="40"/><circle cx="500" cy="50" r="80"/>
<circle cx="500" cy="50" r="130"/>
</g>
<!-- mini skyline -->
<g fill="#0A1929">
<rect x="0"   y="92" width="24" height="18"/>
<rect x="32"  y="96" width="18" height="14"/>
<rect x="58"  y="88" width="28" height="22"/>
<rect x="94"  y="94" width="16" height="16"/>
<rect x="118" y="90" width="26" height="20"/>
<rect x="152" y="96" width="18" height="14"/>
<rect x="178" y="86" width="30" height="24"/>
<rect x="216" y="92" width="20" height="18"/>
<rect x="244" y="96" width="16" height="14"/>
<rect x="268" y="88" width="28" height="22"/>
<rect x="304" y="94" width="18" height="16"/>
<rect x="330" y="86" width="26" height="24"/>
<rect x="364" y="96" width="16" height="14"/>
<rect x="388" y="90" width="30" height="20"/>
<rect x="426" y="94" width="18" height="16"/>
<rect x="452" y="86" width="28" height="24"/>
<rect x="488" y="96" width="16" height="14"/>
<rect x="512" y="88" width="26" height="22"/>
<rect x="546" y="94" width="18" height="16"/>
<rect x="572" y="86" width="30" height="24"/>
<rect x="610" y="96" width="16" height="14"/>
<rect x="634" y="90" width="28" height="20"/>
<rect x="670" y="94" width="18" height="16"/>
<rect x="696" y="86" width="26" height="24"/>
<rect x="730" y="96" width="16" height="14"/>
<rect x="754" y="88" width="30" height="22"/>
<rect x="792" y="94" width="18" height="16"/>
<rect x="818" y="90" width="28" height="20"/>
<rect x="854" y="96" width="16" height="14"/>
<rect x="878" y="86" width="26" height="24"/>
<rect x="912" y="94" width="18" height="16"/>
<rect x="938" y="90" width="28" height="20"/>
<rect x="974" y="96" width="26" height="14"/>
</g>
<!-- horizon glow -->
<rect x="0" y="78" width="1000" height="32" fill="url(#fhGlow)"/>
<!-- blinking windows -->
<g fill="#EAF2FF">
<rect x="66"  y="92" width="3" height="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="0.0s" repeatCount="indefinite"/></rect>
<rect x="124" y="94" width="3" height="4"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" begin="0.6s" repeatCount="indefinite"/></rect>
<rect x="186" y="90" width="3" height="4"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></rect>
<rect x="276" y="92" width="3" height="4"><animate attributeName="opacity" values="1;0.25;1" dur="3.5s" begin="0.3s" repeatCount="indefinite"/></rect>
<rect x="338" y="90" width="3" height="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" begin="0.9s" repeatCount="indefinite"/></rect>
<rect x="396" y="94" width="3" height="4"><animate attributeName="opacity" values="1;0.3;1" dur="3.1s" begin="1.4s" repeatCount="indefinite"/></rect>
<rect x="460" y="90" width="3" height="4"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.7s" begin="0.2s" repeatCount="indefinite"/></rect>
<rect x="520" y="92" width="3" height="4"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" begin="0.8s" repeatCount="indefinite"/></rect>
<rect x="580" y="90" width="3" height="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="1.2s" repeatCount="indefinite"/></rect>
<rect x="642" y="94" width="3" height="4"><animate attributeName="opacity" values="1;0.25;1" dur="3.6s" begin="0.5s" repeatCount="indefinite"/></rect>
<rect x="704" y="90" width="3" height="4"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" begin="1.0s" repeatCount="indefinite"/></rect>
<rect x="762" y="92" width="3" height="4"><animate attributeName="opacity" values="1;0.3;1" dur="3.3s" begin="0.4s" repeatCount="indefinite"/></rect>
<rect x="826" y="94" width="3" height="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="1.3s" repeatCount="indefinite"/></rect>
<rect x="886" y="90" width="3" height="4"><animate attributeName="opacity" values="1;0.25;1" dur="3.0s" begin="0.7s" repeatCount="indefinite"/></rect>
<rect x="946" y="94" width="3" height="4"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.5s" begin="0.1s" repeatCount="indefinite"/></rect>
</g>
<!-- quote text -->
<g text-anchor="middle">
<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.4s" fill="freeze"/>
<text x="500" y="46" font-family="Impact,'Arial Black',sans-serif" font-size="30" letter-spacing="3" fill="#EAF2FF">
<tspan fill="#EAF2FF">THE WEB NEVER SLEEPS.</tspan>
<tspan fill="#E62429"> NEITHER DOES THE DEVELOPER.</tspan>
</text>
</g>
<g opacity="0">
<animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.1s" fill="freeze"/>
<text x="500" y="72" font-family="'Cascadia Code',Consolas,monospace" font-size="13" letter-spacing="4" fill="#8B9BB4">TO BE CONTINUED IN THE NEXT COMMIT...</text>
</g>
</g>
<!-- corner webs -->
<g fill="none" stroke="#EAF2FF" stroke-opacity="0.35" stroke-width="1">
<g transform="translate(14,14)">
<path d="M0,22 L22,0"/><path d="M0,15 L15,0"/><path d="M0,8 L8,0"/>
<path d="M22,0 A26,26 0 0 1 0,22"/>
</g>
<g transform="translate(964,14)">
<path d="M0,22 L22,0"/><path d="M0,15 L15,0"/><path d="M0,8 L8,0"/>
<path d="M0,0 A26,26 0 0 0 22,22"/>
</g>
</g>
<!-- subtle swinging spider (very small, low opacity) -->
<g fill="#E62429" opacity="0.3">
<g>
<animateMotion dur="22s" repeatCount="indefinite" rotate="auto"
path="M80,20 Q250,-10 500,15 Q750,40 920,5"/>
<ellipse cx="0" cy="0" rx="1.8" ry="2.6"/>
<circle cx="0" cy="-3.5" r="1.2"/>
</g>
</g>
</svg>